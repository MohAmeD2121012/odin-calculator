<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <title>Calculator</title>
  </head>
  <body>
    <div class="calculator">
      <div class="output">
        <div data-previous-operand class="previous-operand"></div>
        <div data-current-operand class="current-operand"></div>
      </div>
      <div class="btns">
        <button data-all-clear class="btn btn-dark-grey">AC</button>
        <button data-operation class="btn btn-dark-grey">%</button>
        <button data-delete class="btn btn-dark-grey btn-del">⌫</button>
        <button data-operation class="btn btn-dark-grey">÷</button>
        <button data-numbers class="btn btn-grey">7</button>
        <button data-numbers class="btn btn-grey">8</button>
        <button data-numbers class="btn btn-grey">9</button>
        <button data-operation class="btn btn-dark-grey">×</button>
        <button data-numbers class="btn btn-grey">4</button>
        <button data-numbers class="btn btn-grey">5</button>
        <button data-numbers class="btn btn-grey">6</button>
        <button data-operation class="btn btn-dark-grey">-</button>
        <button data-numbers class="btn btn-grey">1</button>
        <button data-numbers class="btn btn-grey">2</button>
        <button data-numbers class="btn btn-grey">3</button>
        <button data-operation class="btn btn-dark-grey">+</button>
        <button data-numbers class="btn btn-grey">00</button>
        <button data-numbers class="btn btn-grey">0</button>
        <button data-numbers class="btn btn-grey">.</button>
        <button data-equals class="btn btn-orange">=</button>
      </div>
    </div>
  </body>
</html>
